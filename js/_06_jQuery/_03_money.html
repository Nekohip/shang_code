<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" 
    integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" 
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        *{
            box-sizing: border-box;
        }
        .container {
            width: 80%;
            /* background-color: lightblue; */
            margin: auto;
        }

        .form-box{
            width: 591px;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left:50px;
            background-color: lightgrey;
            border-radius: 5%;
            font-size: 20px;
        }

        .result{
            width: 591px;
            /* height: 10vh; */
            margin: auto;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            background-color: lightgrey;
            font-size: 30px;
            border-radius: 5%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h3>財物安全</h3>
            <p>
                <label>1.住:租/月</label>
                <input type="text" name="house" id="house" value="">
            </p>
            <p>
                <label>2.生活:食物/生活用品</label>
                <input type="text" name="life" id="life" value="">
            </p>
            <p>
                <label>3.公共事業費:水、電、網路、電話</label>
                <input type="text" name="utility" id="utility" value="">
            </p>
            <p>
                <label>4.交通費</label>
                <input type="text" name="traffic" id="traffic" value="">
            </p>
            <p>
                <label>5.基本保險</label>
                <input type="text" name="insurance" id="insurance" value="">
            </p>
            <p>
                <button id="calc">計算總額</button>
            </p>
        </div>

        <div class="result">
            <p>每月支出總計:<span id="monthlyTotal"></sapn></p>
            <p>每年支出總計: <span id="annualTotal"></span></p>
        </div>
    </div>
    <script>
        $(document).ready(function() {
            const houseInput = $("#house");
            const lifeInput = $("#life");
            const utilityInput = $("#utility");
            const trafficInput = $("#traffic");
            const insuranceInput = $("#insurance");

            const calcBtn = $("#calc");

            const mTotalSpan = $("#monthlyTotal");
            const aTotalSpan = $("#annualTotal");

            
            calcBtn.click(function() 
            {
                let houseValue = Number(houseInput.val());
                let lifeValue = Number(lifeInput.val());
                let utilityValue = Number(utilityInput.val());
                let trafficValue = Number(trafficInput.val());
                let insuranceValue = Number(insuranceInput.val());

                let monthlyTotal = houseValue + lifeValue + utilityValue + trafficValue + insuranceValue;
                let annualTotal = monthlyTotal * 12;

                mTotalSpan.text(monthlyTotal);
                aTotalSpan.text(annualTotal);
            });
        });
        

    </script>
</body>
</html>
