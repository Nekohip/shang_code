<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Checker</title>
    <style>
        /* 引入 Google Fonts 字型，讓文字看起來更現代 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        /* 全域設定：重置所有元素的內外距，並設定 box-sizing 為 border-box (包含邊框寬度) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body 設定：
           1. 設定字型
           2. 設定背景為漸層色 (從左上到右下)
           3. 使用 Flexbox 讓內容在畫面中垂直水平置中
           4. min-height: 100vh 確保背景填滿整個視窗高度
        */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主要卡片容器：
           1. 白色背景與圓角 (border-radius)
           2. 陰影效果 (box-shadow) 增加立體感
           3. 設定寬度與最大寬度，確保在手機版也不會太寬
           4. 套用 fadeIn 動畫，讓卡片載入時有淡入效果
        */
        .main-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out;
        }

        /* 定義 fadeIn 動畫關鍵影格：
           從透明度 0 且位置偏下 (translateY 20px)
           變為透明度 1 且回到原位 (translateY 0)
        */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-weight: bold;
        }

        /* 輸入框樣式：
           1. 設定內距與邊框
           2. transition 設定所有屬性變化時都有 0.3秒 的過渡效果
        */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        /* 輸入框聚焦 (Focus) 狀態：
           當使用者點擊輸入框時，改變邊框顏色並加上光暈陰影
        */
        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 送出按鈕樣式：
           1. 使用漸層背景色
           2. 設定圓角與無邊框
           3. cursor: pointer 讓滑鼠移上去變成手指形狀
        */
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* 按鈕懸停 (Hover) 效果：
           滑鼠移上去時，按鈕稍微往上浮起 (translateY -2px) 並增加陰影
        */
        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 按鈕點擊 (Active) 效果：
           點擊時按鈕回到原位，產生按壓感
        */
        input[type="submit"]:active {
            transform: translateY(0);
        }

        /* 結果區塊預設樣式：
           1. 預設 opacity: 0 (透明) 且 scale: 0.9 (縮小)，配合 display: none 隱藏
           2. 設定 transition 讓顯示時有放大與淡入的動畫
        */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
            /* 初始隱藏 */
        }

        /* 顯示結果區塊的 class：
           JS 會加上這個 class 來觸發動畫 (變為不透明且恢復原大小)
        */
        .result-box.show {
            opacity: 1;
            transform: scale(1);
            display: block;
        }

        /* 通過時的樣式 (綠色系) */
        .result-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* 未通過時的樣式 (紅色系) */
        .result-fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

    <div class="main-card">
        <h2>成績查詢</h2>
        <form action="">
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" name="name" id="name" placeholder="請輸入姓名">
            </div>

            <div class="form-group">
                <label for="score">分數</label>
                <input type="text" name="score" id="score" placeholder="請輸入分數">
            </div>

            <div class="form-group">
                <input type="submit" value="送出" id="submitBtn">
            </div>
        </form>

        <div class="result-box" id="result">
            <span id="resultSpan"></span>
        </div>
    </div>

    <script>
        let nameInput = document.getElementById("name");
        let scoreInput = document.getElementById("score");
        let submitBtn = document.getElementById("submitBtn");
        let resultDiv = document.getElementById("result");
        let resultSpan = document.getElementById("resultSpan");

        submitBtn.addEventListener("click", function (e) {
            e.preventDefault();

            let tmpName = nameInput.value;
            let tmpScore = Number(scoreInput.value);
            let resultText = "";

            // 移除 show class 以重置動畫狀態
            resultDiv.classList.remove("show");

            // 強制瀏覽器重新渲染 (Reflow)，這樣才能再次觸發動畫
            void resultDiv.offsetWidth;

            if (tmpScore >= 60) {
                resultText = "恭喜通過";
                // 設定 class 為 通過樣式 並加上 show 觸發動畫
                resultDiv.className = "result-box result-success show";
            } else {
                resultText = "很遺憾沒通過";
                // 設定 class 為 失敗樣式 並加上 show 觸發動畫
                resultDiv.className = "result-box result-fail show";
            }

            resultSpan.innerText = `${tmpName} ${tmpScore}分 - ${resultText}`;
        })
    </script>
</body>

</html>
