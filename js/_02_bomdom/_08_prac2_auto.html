<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            /* border:1px solid black; */
            width: 90%;
            height:100vh;
            margin:auto;
        }
        .light {
            width: 300px;
            height:300px;
            background-color: black;
            margin:auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .light_color_red {
            background-color: red;
        }

        .light_color_yellow {
            background-color: yellow;
        }

        .light_color_green {
            background-color: green;
        }

        .btns {
            /* border:1px solid black; */
            width: 400px;
            height:100px;
            margin:auto;
            margin-top: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
        }
        .red {
            width: 100px;
            height:100px;
            background-color: red;
        }
        .yellow {
            width: 100px;
            height:100px;
            background-color: yellow;
        }
        .green {
            width: 100px;
            height:100px;
            background-color: green;
        }
        .timer_text {
            color: white;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="light">
            <h1 id="timer_text" class="timer_text">5</h1>
        </div>
        <div class="btns">
            <div class="red">

            </div>

            <div class="yellow">

            </div>
            
            <div class="green">

            </div>
        </div>
    </div>

    <script>
        let light = document.querySelector(".light");
        let btn_red = document.querySelector(".red");
        let btn_yellow = document.querySelector(".yellow");
        let btn_green = document.querySelector(".green");
        let timer_text = document.getElementById("timer_text");

        //現在秒數
        let last_sec = 0;
        //計時器
        let timer = null;

        console.log("light", light);
        console.log("btn_red", btn_red);
        console.log("btn_yellow", btn_yellow);
        console.log("btn_green", btn_green);
        console.log("timer_text", timer_text);

        function nextColor (color, time, next)
        {
            if(timer) clearInterval(timer);

            if(color === "red")
            {
                light.setAttribute("class", "light light_color_red");
            }
            
            else if(color === "yellow")
            {
                light.setAttribute("class", "light light_color_yellow");
            }
            
            else if(color === "green")
            {
                light.setAttribute("class", "light light_color_green");
            }

            last_sec = time;
            timer_text.textContent = last_sec;

            //每1秒執行一次
            //存成變數才能關掉
            timer = setInterval(function()
            {
                last_sec--;
                timer_text.textContent = last_sec;

                if(last_sec <= 0)
                {
                    clearInterval(timer);
                    if(next === "red") btn_red.click();
                    if(next === "yellow") btn_yellow.click();
                    if(next === "green") btn_green.click();
                }
            }, 1000);
        }
        
        btn_red.onclick = function()
        {
            nextColor ("red", 3, "green"); 
        }
        btn_yellow.onclick = function()
        {
            nextColor ("yellow", 1, "red"); 
        }
        btn_green.onclick = function()
        {
            nextColor ("green", 3, "yellow"); 
        }
        btn_green.click();
    </script>
</body>
</html>
