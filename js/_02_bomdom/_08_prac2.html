<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            /* border:1px solid black; */
            width: 90%;
            height:100vh;
            margin:auto;
        }
        .light {
            width: 300px;
            height:300px;
            background-color: black;
            margin:auto;
        }

        .light_color_red {
            background-color: red;
        }

        .light_color_yellow {
            background-color: yellow;
        }

        .light_color_green {
            background-color: green;
        }

        .btns {
            /* border:1px solid black; */
            width: 400px;
            height:100px;
            margin:auto;
            margin-top: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
        }
        .red {
            width: 100px;
            height:100px;
            background-color: red;
        }
        .yellow {
            width: 100px;
            height:100px;
            background-color: yellow;
        }
        .green {
            width: 100px;
            height:100px;
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="light">

        </div>
        <div class="btns">
            <div class="red">

            </div>

            <div class="yellow">

            </div>
            
            <div class="green">

            </div>
        </div>
    </div>

    <script>
        let light = document.querySelector(".light");
        let btn_red = document.querySelector(".red");
        let btn_yellow = document.querySelector(".yellow");
        let btn_green = document.querySelector(".green");

        console.log("light", light);
        console.log("btn_red", btn_red);
        console.log("btn_yellow", btn_yellow);
        console.log("btn_green", btn_green);

        btn_red.addEventListener("click", function() {
            light.setAttribute("class", "light light_color_red");
        })
        btn_yellow.addEventListener("click", function() {
            light.setAttribute("class", "light light_color_yellow");
        })
        btn_green.addEventListener("click", function() {
            light.setAttribute("class", "light light_color_green");
        })
    </script>
</body>
</html>
