<body>
    <div class="container mt-3" id="alertBox">
        <h2>Alert Here</h2>
        
    </div>

    <div class="container mt-3">
        <button type="button" class="btn btn-success" data-name="blue" id="btnOk">Success</button>
        <button type="button" class="btn btn-danger" data-name="yellow" id="btnDan">Danger</button>
    </div>
</body>
<script>
    $(document).ready(function(){
        const alertBox = $("#alertBox");
        const btnOk = $("#btnOk");
        const btnDan = $("#btnDan");

        console.log("alertBox", alertBox);
        console.log("btnOk", btnOk);
        console.log("btnDan", btnDan);

        btnOk.click(function(e){
            console.log("btn ok");
            let getName = $(this).attr("data-name");

            let okAlert = 
            `<div class = "alert alert-success alert-dismissible">
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    <strong>Success!</strong> Hi ${getName}, This alert box could indicate a successful or positive action.
             </div>`;

             alertBox.append(okAlert);
        });
        
        btnDan.click(function(e){
            console.log("btn danger");
            let getName = $(this).attr("data-name");

            let danAlert = 
            `<div class = "alert alert-danger alert-dismissible">
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    <strong>Danger!</strong> Hi ${getName},This alert box could indicate a dangerous or potentially negative action.
             </div>`;

             alertBox.append(danAlert);
        });
    });
</script>
