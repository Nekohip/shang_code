<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"

    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"

    <style>
        .box {

            margin-top: 20px;

<body>
    <div class="container-fluid">
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <div class="box bg-primary">
                        <img class="img-fluid" src="https://picsum.photos/id/1/1920/1080">

                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="box bg-info">

                    </div>
                </div>
                <div class="col">
                    <div class="box bg-danger">

                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">

                    </div>
                </div>
                <div class="col">
                    <div class="box bg-info">

                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="box bg-dark">
                        <img class="img-fluid" src="https://picsum.photos/id/45/1920/1080">

                    </div>
                </div>
                <div class="col">
                    <div class="box bg-body">
                        <img class="img-fluid" src="https://picsum.photos/id/87/1920/1080">

                    </div>
                </div>
                <div class="col">
                    <div class="box bg-light">
                        <img class="img-fluid" src="https://picsum.photos/id/19/1920/1080">

                    </div>
                </div>
                <div class="col">
                    <div class="box bg-white">
                        <img class="img-fluid" src="https://picsum.photos/id/61/1920/1080">

                    </div>
                </div>
            </div>
